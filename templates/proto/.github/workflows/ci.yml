name: contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # never "stable": the toolchain is part of the contract
      - name: lint
        run: make lint
      - name: breaking against main
        if: github.event_name == 'pull_request'
        run: make breaking
      - name: generated code is current
        run: make check
      - name: tests
        run: go test -race -count=1 ./...
